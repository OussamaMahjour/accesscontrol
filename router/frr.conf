! FRRouting configuration
! Router sits between LAN (192.168.10.0/24), WAN (10.0.0.0/24),
! and the infra/management network (172.20.0.0/24)

frr version 9.0
frr defaults traditional
hostname router
log syslog informational
no ipv6 forwarding

! ── Interfaces ──────────────────────────────────────────────────────────────

interface eth0
 description infra-net (management)
 ip address 172.20.0.254/24
!

interface eth1
 description LAN - client segment
 ip address 192.168.10.1/24
!

interface eth2
 description WAN - uplink
 ip address 10.0.0.1/24
!

! ── Static routes ────────────────────────────────────────────────────────────

! Default route via WAN
ip route 0.0.0.0/0 10.0.0.254

! Route LAN traffic through the router
ip route 192.168.10.0/24 192.168.10.1

! Route infra services (Keycloak, Vault, OPA) from LAN clients
ip route 172.20.0.0/24 172.20.0.254

! ── OSPF (optional — enables dynamic routing) ────────────────────────────────

router ospf
 ospf router-id 10.0.0.1
 network 172.20.0.0/24 area 0
 network 192.168.10.0/24 area 0
 network 10.0.0.0/24 area 0
!

line vty
!